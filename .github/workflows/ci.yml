name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python3 -m py_compile vibepollo-updater tests/test_vibepollo_updater.py tests/upstream_contract.py
      - name: Shell check
        run: bash -n install.sh
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
