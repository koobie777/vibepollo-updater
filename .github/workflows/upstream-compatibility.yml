name: Upstream Compatibility

on:
  schedule:
    # Monday and Thursday, 10:17 UTC. Metadata only; no install or downloads.
    - cron: "17 10 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect upstream GitHub release metadata (read-only)
        run: python3 tests/upstream_contract.py
